<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Hóa học 11 — Bài giảng</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
/* Áp giao diện NGAY trước khi vẽ, tránh nháy màu khi nhúng vào web nền sáng.
   Tham số URL:  ?theme=light|dark   ép giao diện
                 ?embed=1            ẩn nút Toàn màn hình (web chính đã có) */
(function () {
  try {
    var p = new URLSearchParams(location.search).get('theme');
    var t = (p === 'light' || p === 'dark') ? p : localStorage.getItem('theme');
    if (t) document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* localStorage bị chặn thì dùng giao diện hệ thống */ }

  /* Web chính đổi nền giữa chừng thì nhắn sang đây. CỐ Ý nghe tin nhắn thay vì
     để web đổi ?theme= trên địa chỉ: đổi địa chỉ là nạp lại trang, người đang
     xem dở bài nào sẽ bị đá về đầu danh sách. */
  window.addEventListener('message', function (e) {
    if (e.origin !== location.origin) return;
    var d = e.data;
    if (!d || d.loai !== 'hoa11:che-do-mau') return;
    document.documentElement.setAttribute('data-theme', d.toi ? 'dark' : 'light');
  });
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#16181d; --dim:#666e7a; --line:#e3e6ea;
  --acc:#0d7a6f; --acc-soft:#e6f4f2;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    --bg:#101216; --card:#191c22; --ink:#e8eaed; --dim:#98a1ad; --line:#2a2f38;
    --acc:#4ecdc0; --acc-soft:#14312e;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme=dark]{
  --bg:#101216; --card:#191c22; --ink:#e8eaed; --dim:#98a1ad; --line:#2a2f38;
  --acc:#4ecdc0; --acc-soft:#14312e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4);
}
body{background:var(--bg);color:var(--ink);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

header{padding:44px 0 26px}
.veve{display:none;align-items:center;gap:6px;color:var(--dim);text-decoration:none;
  font-size:.88rem;padding:24px 0 0;width:fit-content}
.veve.on{display:inline-flex}
.veve:hover{color:var(--acc)}
.veve + header{padding-top:14px}
h1{font-size:1.85rem;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--dim);margin-top:6px;font-size:.94rem}
.tools{display:flex;gap:10px;margin:22px 0 30px;flex-wrap:wrap}
#q{flex:1;min-width:200px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);font:inherit;font-size:.94rem}
#q:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
.tbtn{padding:11px 15px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:var(--dim);font:inherit;font-size:.9rem;cursor:pointer}
.tbtn:hover{color:var(--ink);border-color:var(--acc)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:18px;
  padding-bottom:60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;
  cursor:pointer;box-shadow:var(--shadow);transition:transform .16s,box-shadow .16s;
  text-decoration:none;color:inherit;display:block}
.card:hover{transform:translateY(-3px);
  box-shadow:0 4px 8px rgba(0,0,0,.07),0 16px 36px rgba(0,0,0,.1)}
.card img{width:100%;height:auto;aspect-ratio:400/223;object-fit:cover;display:block;
  background:var(--acc-soft)}
.meta{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tt{font-weight:650;font-size:1rem}
.cnt{font-size:.79rem;background:var(--acc-soft);color:var(--acc);
  padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap}
.seen{font-size:.74rem;color:var(--dim);padding:0 14px 11px;margin-top:-4px}
.empty{color:var(--dim);padding:50px 0;text-align:center;grid-column:1/-1}

/* khi nhúng vào web khác: bỏ tiêu đề riêng vì web chính đã có tiêu đề mục */
body.nhung header{display:none}
body.nhung .tools{margin:16px 0 22px}
body.nhung .grid{padding-bottom:24px}

#viewer{display:none;position:fixed;inset:0;background:var(--bg);z-index:50;flex-direction:column}
#viewer.on{display:flex}
.vbar{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);
  background:var(--card);flex-wrap:wrap}
.vt{font-weight:650;margin-right:auto}
.vb{border:1px solid var(--line);background:transparent;color:var(--dim);font:inherit;
  font-size:.87rem;padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.vb:hover{color:var(--ink);border-color:var(--acc)}
.pos{font-variant-numeric:tabular-nums;color:var(--dim);font-size:.89rem;min-width:56px;
  text-align:center}

.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;min-height:0;
  position:relative;overflow:hidden}
.stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;
  box-shadow:var(--shadow);background:#fff}
.nav{position:absolute;top:0;bottom:0;width:22%;max-width:150px;border:0;background:transparent;
  cursor:pointer;color:var(--ink);opacity:0;transition:opacity .15s;display:grid;place-items:center}
.stage:hover .nav{opacity:.32}
.nav:hover{opacity:.9}
.nav:disabled{opacity:0;cursor:default}
.nav span{background:var(--card);width:44px;height:44px;border-radius:50%;display:grid;
  place-items:center;box-shadow:var(--shadow);line-height:1;font-size:1.7rem}
.prev{left:0}.next{right:0}

.strip{display:flex;gap:7px;padding:10px 16px;overflow-x:auto;border-top:1px solid var(--line);
  background:var(--card);scrollbar-width:thin}
.strip img{height:52px;width:auto;aspect-ratio:400/223;object-fit:cover;border-radius:5px;cursor:pointer;
  border:2px solid transparent;opacity:.5;transition:opacity .15s;flex:none;
  background:var(--acc-soft)}
.strip img:hover{opacity:.85}
.strip img.cur{border-color:var(--acc);opacity:1}

@media (max-width:640px){
  header{padding:30px 0 18px} h1{font-size:1.45rem}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px}
  .stage{padding:8px} .strip img{height:42px} .vt{font-size:.95rem}
  .nav{opacity:.25}
}
</style>
</head>
<body>

<div id="home" class="wrap">
  <a class="veve" id="veve" href="/">&larr; Về trang chủ</a>
  <header>
    <h1>Hóa học 11 — Bài giảng</h1>
    <p class="sub" id="sub"></p>
  </header>
  <div class="tools">
    <input id="q" type="search" placeholder="Tìm bài… (ví dụ: 7)" autocomplete="off">
    <button class="tbtn" id="theme">Giao diện sáng / tối</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div id="viewer">
  <div class="vbar">
    <button class="vb" id="back">← Tất cả bài</button>
    <span class="vt" id="vt"></span>
    <span class="pos" id="pos"></span>
    <button class="vb" id="dl" hidden>Tải .pptx</button>
    <button class="vb" id="fs">Toàn màn hình</button>
  </div>
  <div class="stage" id="stage">
    <button class="nav prev" id="p" aria-label="Slide trước"><span>&lsaquo;</span></button>
    <img id="pic" alt="">
    <button class="nav next" id="n" aria-label="Slide sau"><span>&rsaquo;</span></button>
  </div>
  <div class="strip" id="strip"></div>
</div>

<script>
/* Đổi thành true SAU KHI chép các file .pptx gốc vào thư mục pptx/ */
var CO_FILE_GOC = false;

/* Địa chỉ trang chủ của web chính.
   Để rỗng ''  -> chạy độc lập, ẩn nút "Về trang chủ"  (mặc định)
   Đặt '/'     -> khi nhúng làm mục con của web khác   */
var TRANG_CHU = '';

var L = [{"n": 1, "slug": "bai-01", "title": "Bài 1", "slides": 12, "pptx": "Bài 1 hóa 11.pptx"}, {"n": 2, "slug": "bai-02", "title": "Bài 2", "slides": 12, "pptx": "Bài 2 hóa 11.pptx"}, {"n": 3, "slug": "bai-03", "title": "Bài 3", "slides": 10, "pptx": "Bài 3 hóa 11.pptx"}, {"n": 4, "slug": "bai-04", "title": "Bài 4", "slides": 9, "pptx": "bài 4 hóa 11.pptx"}, {"n": 5, "slug": "bai-05", "title": "Bài 5", "slides": 10, "pptx": "Bài 5 hóa 11.pptx"}, {"n": 6, "slug": "bai-06", "title": "Bài 6", "slides": 11, "pptx": "bài 6 hóa 11.pptx"}, {"n": 7, "slug": "bai-07", "title": "Bài 7", "slides": 12, "pptx": "Bài 7 hóa 11.pptx"}, {"n": 8, "slug": "bai-08", "title": "Bài 8", "slides": 11, "pptx": "bài 8 hóa 11.pptx"}, {"n": 9, "slug": "bai-09", "title": "Bài 9", "slides": 9, "pptx": "Bài 9 hóa 11.pptx"}, {"n": 10, "slug": "bai-10", "title": "Bài 10", "slides": 11, "pptx": "bài 10 hóa 11.pptx"}, {"n": 11, "slug": "bai-11", "title": "Bài 11", "slides": 9, "pptx": "Bài 11 hóa 11.pptx"}, {"n": 12, "slug": "bai-12", "title": "Bài 12", "slides": 6, "pptx": "bài 12 hóa 11.pptx"}, {"n": 13, "slug": "bai-13", "title": "Bài 13", "slides": 10, "pptx": "Bài 13 hóa 11.pptx"}, {"n": 14, "slug": "bai-14", "title": "Bài 14", "slides": 6, "pptx": "bài 14 hóa 11.pptx"}, {"n": 15, "slug": "bai-15", "title": "Bài 15", "slides": 12, "pptx": "Bài 15 hóa 11.pptx"}, {"n": 16, "slug": "bai-16", "title": "Bài 16", "slides": 12, "pptx": "bài 16 hóa 11.pptx"}, {"n": 17, "slug": "bai-17", "title": "Bài 17", "slides": 12, "pptx": "Bài 17 hóa 11.pptx"}, {"n": 18, "slug": "bai-18", "title": "Bài 18", "slides": 9, "pptx": "bài 18 hóa 11.pptx"}, {"n": 19, "slug": "bai-19", "title": "Bài 19", "slides": 12, "pptx": "Bài 19 hóa 11.pptx"}, {"n": 20, "slug": "bai-20", "title": "Bài 20", "slides": 11, "pptx": "bài 20 hóa 11.pptx"}, {"n": 21, "slug": "bai-21", "title": "Bài 21", "slides": 10, "pptx": "Bài 21 hóa 11.pptx"}, {"n": 22, "slug": "bai-22", "title": "Bài 22", "slides": 9, "pptx": "bài 22 hóa 11.pptx"}, {"n": 23, "slug": "bai-23", "title": "Bài 23", "slides": 12, "pptx": "Bài 23 hóa 11.pptx"}, {"n": 24, "slug": "bai-24", "title": "Bài 24", "slides": 10, "pptx": "bài 24 hóa 11.pptx"}, {"n": 25, "slug": "bai-25", "title": "Bài 25", "slides": 10, "pptx": "Bài 25 hóa 11.pptx"}];

var $ = function(id){ return document.getElementById(id); };
var homeEl = $('home'), viewer = $('viewer'), grid = $('grid'), q = $('q'),
    strip = $('strip'), pic = $('pic'), pos = $('pos'), vt = $('vt'),
    p = $('p'), n = $('n'), dl = $('dl');

function pad(i){ return (i < 10 ? '0' : '') + i; }
function url(slug, i){ return 'slides/' + slug + '/' + pad(i) + '.webp'; }
function murl(slug, i){ return 'mini/' + slug + '/' + pad(i) + '.webp'; }
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

/* nút quay về web chính — chỉ hiện khi đã khai báo TRANG_CHU */
if (TRANG_CHU) {
  var veve = $('veve');
  veve.href = TRANG_CHU;
  veve.className = 'veve on';
}

/* khi được nhúng vào web khác: ẩn nút Toàn màn hình và tiêu đề trùng lặp */
if (new URLSearchParams(location.search).get('embed') === '1') {
  $('fs').hidden = true;
  document.body.className = 'nhung';
}

/* giao diện sáng / tối — giá trị ban đầu đã được áp trong <head> */
$('theme').onclick = function(){
  var dark = window.matchMedia('(prefers-color-scheme:dark)').matches;
  var now = document.documentElement.getAttribute('data-theme') || (dark ? 'dark' : 'light');
  var next = now === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  lsSet('theme', next);
};

/* trang chủ */
var totalSlides = 0;
for (var i = 0; i < L.length; i++) totalSlides += L[i].slides;
$('sub').textContent = L.length + ' bài · ' + totalSlides + ' slide';

function draw(f){
  var t = (f || '').trim().toLowerCase().replace(/^bài\s*/, '');
  var hit = L.filter(function(l){
    return !t || String(l.n) === t || String(l.n).indexOf(t) === 0;
  });
  if (!hit.length){ grid.innerHTML = '<p class="empty">Không tìm thấy bài nào.</p>'; return; }
  grid.innerHTML = hit.map(function(l){
    var at = +lsGet('pos:' + l.slug) || 0;
    return '<a class="card" href="#' + l.slug + '">' +
      '<img src="thumbs/' + l.slug + '.webp" loading="lazy" decoding="async" ' +
        'width="400" height="225" alt="Bài ' + l.n + '">' +
      '<div class="meta"><span class="tt">Bài ' + l.n + '</span>' +
      '<span class="cnt">' + l.slides + ' slide</span></div>' +
      (at > 1 ? '<div class="seen">Đang xem dở — slide ' + at + '</div>' : '') +
      '</a>';
  }).join('');
}
q.oninput = function(e){ draw(e.target.value); };

/* trình xem */
var cur = null, idx = 1;

function openLesson(slug, start){
  cur = null;
  for (var i = 0; i < L.length; i++) if (L[i].slug === slug) cur = L[i];
  if (!cur){ location.hash = ''; return; }

  idx = start || +lsGet('pos:' + slug) || 1;
  if (idx < 1) idx = 1;
  if (idx > cur.slides) idx = cur.slides;

  vt.textContent = 'Bài ' + cur.n;
  dl.hidden = !CO_FILE_GOC;

  var s = '';
  for (var k = 1; k <= cur.slides; k++)
    s += '<img src="' + murl(slug, k) + '" loading="lazy" decoding="async" data-i="' + k +
         '" width="200" height="112" alt="Slide ' + k + '">';
  strip.innerHTML = s;

  viewer.classList.add('on');
  homeEl.style.display = 'none';
  show();
}

function show(){
  pic.src = url(cur.slug, idx);
  pic.alt = 'Bài ' + cur.n + ' — slide ' + idx;
  pos.textContent = idx + ' / ' + cur.slides;
  p.disabled = idx <= 1;
  n.disabled = idx >= cur.slides;

  var tn = strip.children;
  for (var i = 0; i < tn.length; i++)
    tn[i].classList.toggle('cur', +tn[i].getAttribute('data-i') === idx);
  var c = strip.querySelector('.cur');
  if (c) c.scrollIntoView({ block:'nearest', inline:'center', behavior:'smooth' });

  lsSet('pos:' + cur.slug, idx);
  if (idx < cur.slides) new Image().src = url(cur.slug, idx + 1);   /* tải trước 1 slide */

  /* Trên giao thức file:// một số trình duyệt chặn replaceState -> bỏ qua, không để vỡ trang */
  var want = '#' + cur.slug + '/' + idx;
  if (location.hash !== want) { try { history.replaceState(null, '', want); } catch (e) {} }
}

function go(d){
  var t = idx + d;
  if (t >= 1 && cur && t <= cur.slides){ idx = t; show(); }
}
p.onclick = function(){ go(-1); };
n.onclick = function(){ go(1); };
strip.onclick = function(e){
  var i = e.target.getAttribute && e.target.getAttribute('data-i');
  if (i){ idx = +i; show(); }
};
$('back').onclick = function(){ location.hash = ''; };
dl.onclick = function(){ if (cur) location.href = 'pptx/' + cur.pptx; };
$('fs').onclick = function(){
  if (document.fullscreenElement) document.exitFullscreen();
  else if (viewer.requestFullscreen) viewer.requestFullscreen();
};

document.addEventListener('keydown', function(e){
  if (!viewer.classList.contains('on')) return;
  var k = e.key;
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown'){ e.preventDefault(); go(1); }
  else if (k === 'ArrowLeft' || k === 'PageUp'){ e.preventDefault(); go(-1); }
  else if (k === 'Home'){ idx = 1; show(); }
  else if (k === 'End'){ idx = cur.slides; show(); }
  else if (k === 'Escape' && !document.fullscreenElement) location.hash = '';
});

var x0 = null;
var stage = $('stage');
stage.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
stage.addEventListener('touchend', function(e){
  if (x0 === null) return;
  var d = e.changedTouches[0].clientX - x0;
  x0 = null;
  if (Math.abs(d) > 45) go(d < 0 ? 1 : -1);
}, {passive:true});

/* điều hướng */
function route(){
  var h = decodeURIComponent(location.hash.slice(1));
  if (!h){
    viewer.classList.remove('on');
    homeEl.style.display = '';
    cur = null;
    draw(q.value);
    return;
  }
  var parts = h.split('/');
  openLesson(parts[0], +parts[1] || 0);
}
window.addEventListener('hashchange', route);
draw('');
route();
</script>
</body>
</html>
